<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030607" />
  <title>归林｜森林生存恐怖</title>
  <link rel="preload" href="assets/player.png?v=20260728-assets2" as="image" />
  <link rel="preload" href="assets/forest-assets.png?v=20260728-assets2" as="image" />
  <link rel="preload" href="assets/ark-pixel-12px-zh_cn.woff2?v=20260728-assets2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="styles.css?v=20260728-horror3" />
</head>
<body>
  <main id="app">
    <section id="titleScreen" class="screen title-screen">
      <div class="title-card">
        <p class="eyebrow">FOREST SURVIVAL HORROR</p>
        <h1>归林</h1>
        <p class="subtitle">白天收集，夜晚活下去。</p>
        <div class="class-picker" aria-label="选择职业">
          <p>选择职业</p>
          <div class="class-buttons">
            <button class="class-button selected" data-class="0">枪手</button>
            <button class="class-button" data-class="1">护士</button>
            <button class="class-button" data-class="2">伐木工</button>
            <button class="class-button" data-class="3">守望者</button>
            <button class="class-button" data-class="4">棒球女</button>
            <button class="class-button" data-class="5">科学家</button>
          </div>
        </div>
        <div id="loadingStatus" class="loading-status" aria-live="polite">
          <div class="loading-copy">
            <span id="loadingText">正在准备像素素材…</span>
            <span id="loadingCount">0 / 3</span>
          </div>
          <div class="loading-track"><span id="loadingProgress"></span></div>
        </div>
        <button id="startButton" class="primary-button" disabled>素材加载中…</button>
        <button id="retryAssetsButton" class="retry-assets-button hidden">重新加载素材</button>
        <p class="title-tip">雾会记住每一个迷路的人</p>
      </div>
    </section>

    <section id="gameScreen" class="screen game-screen hidden">
      <canvas id="gameCanvas" width="960" height="540" aria-label="归林游戏画面"></canvas>
      <div class="hud">
        <div class="hud-row">
          <span id="phaseLabel">白天</span>
          <span id="dayLabel">第 1 天</span>
          <span id="healthLabel">生命 100</span>
        </div>
        <div class="hud-row secondary">
          <span id="resourceLabel">木材 0　石头 0　浆果 0</span>
          <span id="flashlightLabel">手电筒 开</span>
        </div>
        <div class="hud-row secondary"><span id="buildingLabel">当前：空手</span><span>1-9 快捷栏</span></div>
      </div>
      <button id="inventoryButton" class="inventory-button" aria-expanded="false" aria-controls="inventoryPanel">
        <span id="inventoryButtonLabel">背包</span> <span>[I]</span>
      </button>
      <section id="inventoryPanel" class="inventory-panel hidden" aria-label="玩家物品栏">
        <div class="inventory-header">
          <div>
            <p>物品栏</p>
            <span>游戏已暂停</span>
          </div>
          <span id="inventoryCapacity" class="inventory-capacity">0 / 12 格</span>
        </div>
        <div class="inventory-grid">
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="0"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="1"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="2"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="3"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="4"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="5"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="6"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="7"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="8"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="9"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="10"><span class="item-sprite" aria-hidden="true"></span></button>
          <button type="button" class="inventory-slot item-empty empty-slot" data-inventory-slot="11"><span class="item-sprite" aria-hidden="true"></span></button>
        </div>
        <p class="inventory-tip">拖动物品可以移动或交换位置，点击浆果可以食用</p>
      </section>
      <div id="message" class="message" aria-live="polite"></div>
      <nav id="quickbar" class="quickbar" aria-label="快捷栏">
        <button class="quick-slot quick-empty slot-empty" data-quick-slot="0" data-item-kind="empty" title="空快捷格">
          <span class="quick-key">1</span><span class="item-sprite quick-wall"></span><span class="quick-name">木墙</span>
        </button>
        <button class="quick-slot quick-empty slot-empty" data-quick-slot="1" data-item-kind="empty" title="空快捷格">
          <span class="quick-key">2</span><span class="item-sprite quick-door"></span><span class="quick-name">木门</span>
        </button>
        <button class="quick-slot quick-empty slot-empty" data-quick-slot="2" data-item-kind="empty" title="空快捷格">
          <span class="quick-key">3</span><span class="item-sprite quick-floor"></span><span class="quick-name">地板</span>
        </button>
        <button class="quick-slot quick-empty slot-empty" data-quick-slot="3" data-item-kind="empty" title="空快捷格">
          <span class="quick-key">4</span><span class="item-sprite quick-chest"></span><span class="quick-name">箱子</span>
        </button>
        <button class="quick-slot quick-empty slot-empty" data-quick-slot="4" data-item-kind="empty" title="空快捷格">
          <span class="quick-key">5</span><span class="item-sprite quick-workbench"></span><span class="quick-name">工作台</span>
        </button>
        <button class="quick-slot quick-empty slot-empty" data-quick-slot="5" data-item-kind="empty" title="空快捷格">
          <span class="quick-key">6</span><span class="item-sprite quick-trap"></span><span class="quick-name">陷阱</span>
        </button>
        <button class="quick-slot quick-empty slot-empty" data-quick-slot="6" data-item-kind="empty" title="空快捷格">
          <span class="quick-key">7</span><span class="item-sprite item-berry"></span>
          <span class="quick-name">浆果</span>
        </button>
        <button class="quick-slot quick-empty slot-empty" data-quick-slot="7" data-item-kind="empty" title="空快捷格">
          <span class="quick-key">8</span><span class="item-sprite"></span><span class="quick-name">空</span>
        </button>
        <button class="quick-slot quick-empty slot-empty" data-quick-slot="8" data-item-kind="empty" title="空快捷格">
          <span class="quick-key">9</span><span class="item-sprite"></span><span class="quick-name">空</span>
        </button>
      </nav>
      <div class="controls">WASD 移动　左键 武器攻击/非武器采集　右键建造　E 开门/篝火　1-9 快捷栏　Esc 空手　F 手电筒　I 背包</div>
      <div id="gameOver" class="game-over hidden">
        <h2>你倒在了森林里</h2>
        <button id="restartButton" class="primary-button">重新开始</button>
      </div>
    </section>
  </main>
  <script type="module" src="game.js?v=20260728-horror3"></script>
</body>
</html>
