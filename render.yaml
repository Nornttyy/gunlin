services:
  - type: web
    name: gunlin-multiplayer-nornttyy
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://nornttyy.github.io
